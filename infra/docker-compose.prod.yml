# LoadedOut — Production Stack (doosra-prod, europe-west12-c)
#
# Host port bindings — the frontend is the ONLY service that binds any:
#   80, 443 → frontend (Caddy: serves the React SPA, proxies /api/ and /mcp/)
#   backend, mcp, db and mongo are reachable only on lifeplan-net.
#
# NOTE: this Caddy terminates TLS for EVERY project on this VM (erp-rag,
# polaris, pitwall, bondcheck, gre-vocab, portfolio), not just LoadedOut.
# Recreating the frontend container briefly takes all of them down — prefer
# `docker exec infra-frontend-1 caddy reload --config /etc/caddy/Caddyfile
# --adapter caddyfile` for routing-only changes. See DEPLOY.md.
#
# Deploy from ~/projects/loaded-out/infra/ (Compose project name: "infra")
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# First-time DB migration (after up):
#   docker compose -f docker-compose.prod.yml exec backend alembic upgrade head

services:

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: lifeplan_db
      POSTGRES_USER: lifeplan_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - lifeplan-pgdata:/var/lib/postgresql/data
    networks:
      - lifeplan-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifeplan_user -d lifeplan_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - lifeplan-mongodata:/data/db
    networks:
      - lifeplan-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      # Override DB URLs to use Docker internal service hostnames
      DATABASE_URL: "postgresql+asyncpg://lifeplan_user:${POSTGRES_PASSWORD}@db:5432/lifeplan_db"
      DATABASE_URL_SYNC: "postgresql+psycopg2://lifeplan_user:${POSTGRES_PASSWORD}@db:5432/lifeplan_db"
      MONGODB_URI: "mongodb://mongo:27017"
      MONGODB_DB_NAME: "lifeplan"
      # ADC via GCE metadata server — no credentials file needed on this VM
      GOOGLE_APPLICATION_CREDENTIALS: ""
      GIF_CACHE_DIR: "/data/gifs"
    volumes:
      - lifeplan-gifs:/data/gifs
    networks:
      - lifeplan-net
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_healthy

  mcp:
    build:
      context: ../mcp
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MCP_DATABASE_URL: "postgresql://lifeplan_user:${POSTGRES_PASSWORD}@db:5432/lifeplan_db"
      MCP_PORT: "8003"
    networks:
      - lifeplan-net
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        # Relative URL — Caddy proxies /api/ to the backend container internally
        VITE_API_URL: /api/v1
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      # Caddy config. The Dockerfile also COPYs this file so the image stays
      # self-contained, but the bind mount wins at runtime — which means a
      # routing change is an edit + zero-downtime reload rather than a full
      # image rebuild. This container terminates TLS for every project on the
      # VM, so avoid recreating it when a reload will do:
      #   docker exec infra-frontend-1 \
      #     caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Published Android APK — served at /loadedout.apk. Bind-mounted (not baked
      # into the image or committed) so it survives rebuilds; replace the host
      # file in infra/apk/ to ship a new build.
      - ./apk/loadedout.apk:/usr/share/caddy/loadedout.apk:ro
    networks:
      - lifeplan-net
    depends_on:
      - backend

# Network and volumes are pre-existing (originally created under the "loadedout"
# project). Declared external so any compose project name reuses them in place
# instead of trying to recreate them / emitting ownership warnings.
networks:
  lifeplan-net:
    external: true
    name: lifeplan-net

volumes:
  lifeplan-pgdata:
    external: true
    name: lifeplan-pgdata
  lifeplan-mongodata:
    external: true
    name: lifeplan-mongodata
  lifeplan-gifs:
    external: true
    name: lifeplan-gifs
  caddy_data:
    external: true
    name: lifeplan-caddy-data
  caddy_config:
    external: true
    name: lifeplan-caddy-config
